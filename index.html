<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>FoolsIron</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>FoolsIron</h1>
    <p class="sub">持続音・雑音・声。鳴らして、置いておく</p>
  </header>

  <button id="play">鳴らす</button>
  <p id="status">停止中</p>

  <section class="card">
    <div class="row"><label for="preset">プリセット</label>
      <select id="preset"></select><span id="dirty" class="note"></span></div>
    <div class="btns">
      <button id="save">保存</button>
      <button id="del">削除</button>
      <button id="share">書き出し</button>
      <button id="load">読み込み</button>
    </div>
    <div class="row"><label for="morph">移ろい</label>
      <select id="morph">
        <option value="0">即時</option>
        <option value="5">5秒かけて</option>
        <option value="15">15秒かけて</option>
        <option value="30">30秒かけて</option>
        <option value="60">60秒かけて</option>
      </select></div>
    <div class="row"><label>種</label>
      <span id="seed" class="val"></span><button id="reseed" class="small">振り直す</button></div>
  </section>

  <section class="card">
    <div class="row"><label for="vol">音量</label>
      <input id="vol" type="range" min="0" max="100" step="1"><output id="volOut"></output></div>
    <div class="row"><label for="timer">タイマー</label>
      <select id="timer">
        <option value="0">なし</option>
        <option value="15">15分</option>
        <option value="30">30分</option>
        <option value="45">45分</option>
        <option value="60">60分</option>
        <option value="90">90分</option>
        <option value="120">120分</option>
      </select></div>
  </section>

  <div id="panels"></div>

  <footer><a href="test.html">消灯再生試験</a></footer>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgNote" class="note"></p>
  <textarea id="dlgText" rows="6" spellcheck="false"></textarea>
  <div class="btns">
    <button id="dlgOk"></button>
    <button id="dlgClose">閉じる</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
