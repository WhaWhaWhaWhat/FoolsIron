<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>FoolsIron</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="unit">
  <header>
    <h1>FoolsIron</h1>
    <select id="preset" aria-label="プリセット"></select>
    <span id="dirty" title="変更あり"></span>
    <button id="play">鳴らす</button>
  </header>
  <nav id="tabs"></nav>
  <div id="faces"></div>
  <footer>
    <label for="vol">音量</label>
    <input id="vol" type="range" min="0" max="100" step="1">
    <label for="timer">タイマー</label>
    <select id="timer">
      <option value="0">なし</option>
      <option value="15">15分</option>
      <option value="30">30分</option>
      <option value="45">45分</option>
      <option value="60">60分</option>
      <option value="90">90分</option>
      <option value="120">120分</option>
    </select>
    <span id="status">停止中</span>
  </footer>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgNote" class="note"></p>
  <textarea id="dlgText" rows="6" spellcheck="false"></textarea>
  <div class="btns">
    <button id="dlgOk"></button>
    <button id="dlgClose">閉じる</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
